name: Digital Darwin verification

on:
  pull_request:
  push:
    branches: [dd-06-experiment-lab, dd-07-first-playable-evolution, dd-08-evolution-console, dd-09-world-resources, dd-10-evolution-tree, dd-11-ecology-crises, dd-12-first-game-release, dd-13-world-welcome-choice-ux, dd-14-game-feel-impact, dd-15-world-geography]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [core, browser, stress, lab-1920, lab-1366, lab-390, LAB-E01, LAB-E02, LAB-E03, LAB-E04, game, game-1920, game-1366, game-390, planet, tree, ecology, release, welcome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        if: matrix.group == 'browser' || matrix.group == 'planet' || matrix.group == 'tree' || matrix.group == 'ecology' || matrix.group == 'release' || matrix.group == 'welcome' || startsWith(matrix.group, 'lab-') || startsWith(matrix.group, 'game-')
        run: npx --no-install playwright install --with-deps chromium
      - name: Run verification group
        env:
          DD_VERIFY_GROUP: ${{ matrix.group }}
        run: npm run verify
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-darwin-${{ matrix.group }}
          path: outputs/verification/
          if-no-files-found: ignore
