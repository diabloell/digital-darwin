name: Digital Darwin verification

on:
  pull_request:
  push:
    branches: [dd-06-experiment-lab]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [core, browser, lab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        if: matrix.group != 'core'
        run: npx --no-install playwright install --with-deps chromium
      - name: Run verification group
        env:
          DD_VERIFY_GROUP: ${{ matrix.group }}
        run: npm run verify
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-darwin-${{ matrix.group }}
          path: outputs/verification/
          if-no-files-found: ignore
